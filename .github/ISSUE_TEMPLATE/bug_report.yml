name: Bug report
description: Report a reproducible application or data problem.
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the commit, commands, and environment.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add safe logs or source IDs. Remove credentials and personal data.
