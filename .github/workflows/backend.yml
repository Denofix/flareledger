name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types, corpus tests and image build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned backend and check dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: python -m ruff check .
      - name: Check formatting
        working-directory: backend
        run: python -m ruff format --check .
      - name: Check types
        working-directory: backend
        run: python -m mypy app
      - name: Test the real corpus and backend recovery
        working-directory: backend
        run: python -m pytest -q
      - name: Build the backend image
        run: docker build --tag flareledger-api:ci backend
