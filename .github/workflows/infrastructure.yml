name: Infrastructure checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Compose configuration and SQLite backup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate local Compose configuration
        run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Test SQLite backup including an active WAL
        run: python scripts/test_backup.py
      - name: Test snapshot verification and retention
        run: python scripts/test_snapshots.py
      - name: Test database replacement and rollback
        run: python scripts/test_replace.py
      - name: Test rehearsal cleanup ownership and refusal safety
        run: python scripts/test_rehearsal_cleanup.py
      - name: Test deploy, rollback and monitoring logic
        run: python scripts/test_deploy.py
      - name: Test cross-process operation locks and inherited backup
        run: python scripts/test_operation_lock.py
      - name: Test Telegram incident transitions without network or credentials
        run: python scripts/test_monitor_alerts.py
      - name: Check Caddy routing with disposable test fixtures
        run: python scripts/test_caddy.py
      - name: Validate production isolation without deployment
        run: python scripts/check_production.py
      - name: Test Nginx HTTP and HTTPS with disposable fixtures
        run: python scripts/test_nginx.py
      - name: Describe check scope
        run: echo 'Compose configuration, backup and isolated Caddy/Nginx routing tests only. Application builds, scientific data, real API integration, public certificates and deployment are not verified by this workflow.' >> "$GITHUB_STEP_SUMMARY"
