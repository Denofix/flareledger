name: Production monitor

# External check of the frontend and public API from outside the VPS. It sends a handful of
# read-only GET requests, needs no secrets and changes nothing. A run fails only
# when every one of three attempts, one minute apart, fails; the failed run is
# the alert. Scheduled workflows run from the default branch.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  external:
    name: Frontend and API readiness and TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check website, frontend API rewrite, catalogue and TLS
        run: python scripts/monitor_production.py --mode external --attempts 3 --interval 60
