# Install as flareledger-api.conf only for initial HTTP-01 certificate issuance.
server {
    listen 80;
    server_name api.flareledger.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
