# Replace the bootstrap vhost only after the named certificate exists.
server {
    listen 80;
    server_name api.flareledger.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://api.flareledger.fun$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.flareledger.fun;

    ssl_certificate /etc/letsencrypt/live/api.flareledger.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.flareledger.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    # Docker DNS is re-queried after backend container recreation. Variable-based
    # proxy_pass avoids preventing QResto startup when the API is absent.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $flareledger_backend http://flareledger-api:8000;

    location ~ ^/api(?:/|$) {
        proxy_pass $flareledger_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_send_timeout 40s;
        proxy_next_upstream off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
