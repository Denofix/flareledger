# Install as /etc/systemd/system/flareledger-monitor.service.d/telegram.conf
[Service]
EnvironmentFile=/home/tymofii/.config/flareledger/telegram.env
StateDirectory=flareledger-monitor
StateDirectoryMode=0700
ExecStart=
ExecStart=/usr/bin/python3 /home/tymofii/flareledger-ops/scripts/monitor_production.py --mode local --snapshots /var/backups/flareledger/snapshots --attempts 3 --interval 60 --telegram-state /var/lib/flareledger-monitor
